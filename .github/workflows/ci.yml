name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    name: C / C++ (optimizer + simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C native CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror" CFLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Werror"
      - run: make -C native test

  api:
    name: API (Jest · PostgreSQL + MongoDB + MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: tourwerk_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: erp_test }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tourwerk_test
      MONGO_URL: mongodb://localhost:27017/tourwerk_test
      MYSQL_URL: mysql://root:root@localhost:3306/erp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: make -C native
      - run: npm -w apps/api run typecheck
      - run: npm -w apps/api test

  web:
    name: Web (TypeScript · React Testing Library · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm -w apps/web run typecheck
      - run: npm -w apps/web test
      - run: npm -w apps/web run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tourwerk_e2e
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: make -C native
      - run: npx -w e2e playwright install --with-deps chromium
      - run: npm -w apps/api exec prisma generate
      - run: npm -w e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [native, api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api web
